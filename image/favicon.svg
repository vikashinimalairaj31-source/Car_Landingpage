<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d99b26" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#shield-grad)" stroke="#d99b26" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Crown / Automotive Insignia -->
  <g filter="url(#gold-glow)">
    <!-- Crown Base -->
    <path d="M16 46h32c0 2-2 3.5-4 3.5H20c-2 0-4-1.5-4-3.5z" fill="url(#gold-grad)"/>
    <rect x="18" y="42.5" width="28" height="2" rx="1" fill="#fef3c7" opacity="0.8"/>

    <!-- Crown Peaks -->
    <path d="M16 41l4-18 8 10 4-13 4 13 8-10 4 18H16z" fill="url(#gold-grad)"/>

    <!-- Jewels / Peak Accents -->
    <circle cx="20" cy="22" r="2.2" fill="#fff" />
    <circle cx="32" cy="19" r="2.8" fill="#fff" />
    <circle cx="44" cy="22" r="2.2" fill="#fff" />

    <!-- Center Gem Facet -->
    <polygon points="32,27 28.5,33 32,38 35.5,33" fill="#fef3c7" opacity="0.9"/>
  </g>
</svg>
